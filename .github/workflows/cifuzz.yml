name: CIFuzz

# Fuzzes pull requests through OSS-Fuzz's CIFuzz: builds the upstream `r`
# project definition (google/oss-fuzz/projects/r) with this pull request's
# checkout of the harnesses in place of the clone, and briefly fuzzes the
# targets affected by the change, so a broken or crashing harness is caught
# before it merges.
#
# Because it runs the real project definition, R is built from source on
# every run -- around an hour on a GitHub-hosted runner.  That is the price
# of exercising exactly what OSS-Fuzz builds, including the patches in
# patches/: a patch that applies but does not compile fails here.  (A patch
# that no longer applies is caught in minutes by patches-apply.yml.)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'harnesses/**'
      - 'dictionaries/**'
      - 'options/**'
      - 'seeds/**'
      - 'patches/**'
      - 'ossfuzz.sh'
      - '.github/workflows/cifuzz.yml'

permissions: read-all
jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Build Fuzzers
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
        with:
          oss-fuzz-project-name: 'r'
          language: c
      - name: Run Fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
        # The decompress and unserialize targets can be asked for gigabytes
        # by a crafted input, and some regex patterns make TRE backtrack for
        # a very long time; both are expected behaviour rather than
        # regressions, and reporting them would fail nearly every run and
        # train reviewers to ignore this check.  Memory-safety bugs, which
        # are the point, are still reported.
        with:
          oss-fuzz-project-name: 'r'
          fuzz-seconds: 300
          language: c
          output-sarif: true
          report-timeouts: false
          report-ooms: false
      - name: Upload crash artifacts
        uses: actions/upload-artifact@v4
        if: failure() && steps.build.outcome == 'success'
        with:
          name: artifacts
          path: ./out/artifacts
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.build.outcome == 'success'
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
