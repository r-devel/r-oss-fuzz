name: CIFuzz

# CIFuzz builds the `r` project as defined in google/oss-fuzz, so it cannot
# work until that project is merged (google/oss-fuzz#15952).  Until then it
# would fail on every pull request, so it is manual-only; pull requests are
# fuzzed by cflite-pr.yml instead, which needs nothing from upstream.
#
# When the upstream project lands, restore the pull_request trigger below and
# decide whether to keep both -- CIFuzz exercises the real OSS-Fuzz project
# definition, which ClusterFuzzLite does not.
#
#  pull_request:
#    paths:
#      - 'harnesses/**'
#      - 'dictionaries/**'
#      - 'options/**'
#      - 'seeds/**'
#      - 'ossfuzz.sh'
#      - '.github/workflows/cifuzz.yml'

on:
  workflow_dispatch:

permissions: read-all
jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Build Fuzzers
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
        with:
          oss-fuzz-project-name: 'r'
          language: c
      - name: Run Fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
        with:
          oss-fuzz-project-name: 'r'
          fuzz-seconds: 300
          language: c
          output-sarif: true
      - name: Upload crash artifacts
        uses: actions/upload-artifact@v4
        if: failure() && steps.build.outcome == 'success'
        with:
          name: artifacts
          path: ./out/artifacts
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.build.outcome == 'success'
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
