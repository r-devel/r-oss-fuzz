name: Base image

# Builds the ClusterFuzzLite base image -- an OSS-Fuzz builder with an
# instrumented R compiled in -- and publishes it to this repository's GitHub
# Container Registry namespace.  The fuzzing workflows consume it so they
# never have to build R themselves.
#
# The weekly schedule bounds how far the R snapshot in the image drifts behind
# SVN trunk.  Run it manually (Actions -> Base image -> Run workflow) after
# changing how R is built, or to pick up a newer trunk immediately.

on:
  workflow_dispatch:
  schedule:
    # Sundays at 03:00 UTC.
    - cron: '0 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'ossfuzz.sh'
      - 'docker/base/**'
      - '.github/workflows/base-image.yml'

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    # Compiling R with sanitizers is slow, and GitHub-hosted runners are
    # considerably slower than a workstation.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The R build tree plus the resulting image comfortably exceed what is
      # free on a stock runner, so reclaim space from preinstalled toolchains
      # this build has no use for.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/r-base:address
