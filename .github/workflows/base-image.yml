name: Base image

# Builds the ClusterFuzzLite base image -- an OSS-Fuzz builder with an
# instrumented R compiled in -- and publishes it to this repository's GitHub
# Container Registry namespace.  The fuzzing workflows consume it so they
# never have to build R themselves.
#
# The weekly schedule bounds how far the R snapshot in the image drifts behind
# SVN trunk.  Run it manually (Actions -> Base image -> Run workflow) after
# changing how R is built, or to pick up a newer trunk immediately.
#
# Pull requests that change the inputs of this image (the patches, the build
# script, the Dockerfile) run the same build without publishing it, with
# R_PATCH_STRICT set so a patch that no longer applies fails the run.  The
# fast check in patches-apply.yml catches most patch problems in minutes;
# this is the tier that also catches a patch that applies but does not
# compile.

on:
  workflow_dispatch:
  schedule:
    # Sundays at 03:00 UTC.
    - cron: '0 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'ossfuzz.sh'
      - 'docker/base/**'
      - 'patches/**'
      - '.github/workflows/base-image.yml'
  pull_request:
    paths:
      - 'ossfuzz.sh'
      - 'docker/base/**'
      - 'patches/**'
      - '.github/workflows/base-image.yml'

permissions: read-all

# Every publishing run pushes the same r-base:address tag, so two overlapping
# builds race and the one that finishes last wins -- which once shipped an
# image built from an older commit than one pushed seconds earlier
# (back-to-back PR merges, 2026-09-04).  Cancel in-flight builds so only the
# newest trigger's image lands.  Pull-request builds publish nothing, so each
# gets its own group: they neither cancel a publishing build nor each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('base-image-pr-{0}', github.event.pull_request.number) || 'base-image' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Compiling R with sanitizers is slow, and GitHub-hosted runners are
    # considerably slower than a workstation.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The R build tree plus the resulting image comfortably exceed what is
      # free on a stock runner, so reclaim space from preinstalled toolchains
      # this build has no use for.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image (and push it, unless this is a pull request)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/r-base:address
          build-args: |
            R_PATCH_STRICT=${{ github.event_name == 'pull_request' && '1' || '' }}
