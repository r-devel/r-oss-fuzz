name: ClusterFuzzLite prune

# Minimises the stored corpus: drops inputs that no longer contribute coverage
# so the corpus stays small enough to load quickly and cheap to store.  Without
# this the corpus grows without bound and every batch run pays for it.
#
# DISABLED (2026-09) along with cflite-batch.yml: nothing adds to the stored
# corpus any more, so there is nothing to prune on a schedule.
#
#  schedule:
#    # Mondays at 04:00 UTC, after a week of batch runs have added to it.
#    - cron: '0 4 * * 1'

on:
  workflow_dispatch:

permissions: read-all

jobs:
  Prune:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        # Prune mode calls libFuzzer's corpus merge directly and never
        # consults REPORT_TIMEOUTS/REPORT_OOMS (those only affect fuzz
        # runs), so there is nothing to suppress here and the merge runs
        # under libFuzzer's built-in rss limit.  Corpus units expensive
        # enough to trip that limit are handled where they arise instead:
        # the agrep/grep harnesses reject patterns whose bounded-repeat
        # product would blow up TRE at compile time, so replaying them
        # during the merge costs nothing.
        #
        # In prune mode fuzz-seconds is not fuzzing time: cifuzz divides it
        # across the targets and hands each slice to libFuzzer as the merge
        # deadline (run_seconds = max(remaining // left, fuzz_seconds // n),
        # infra/cifuzz/run_fuzzers.py).  A slice that expires aborts the whole
        # step with "Merging new testcases timed out", losing the pruned
        # corpora of every target that had not yet run.  At 600 the slowest
        # target, unserialize, got 120s for 2270 inputs it replays at ~16
        # exec/s, and that is what happened.  Budget for the slow targets
        # rather than the average: 2400 floors every target at 300s, and the
        # whole step has historically finished in under 10 minutes against a
        # 120-minute job timeout, so the ceiling costs nothing when unused.
        with:
          language: c
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 2400
          mode: 'prune'
