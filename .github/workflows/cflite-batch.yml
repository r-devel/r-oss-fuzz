name: ClusterFuzzLite batch

# Continuous fuzzing: runs every target for a while and merges anything new
# into the stored corpus, so coverage accumulates instead of restarting from
# the seed corpus each time.  This is what keeps the harnesses exercised while
# the OSS-Fuzz integration is pending.
#
# Corpora persist through ClusterFuzzLite's GitHub Actions filestore (the
# Actions cache).  That is subject to the cache size limit and eviction; if
# the corpus becomes valuable enough to guarantee, switch to a dedicated
# storage repository via the storage-repo input.

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:00 UTC.
    - cron: '0 2 * * *'

permissions: read-all

jobs:
  Batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          language: c
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: 'batch'
          parallel-fuzzing: true
          # See cflite-pr.yml -- timeouts and OOMs are expected behaviour for
          # the regex and decompression targets, not regressions.
          report-timeouts: false
          report-ooms: false
