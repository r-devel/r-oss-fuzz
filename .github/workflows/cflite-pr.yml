name: ClusterFuzzLite PR

# Fuzzes pull requests: builds the harnesses against the prebuilt R base image
# and briefly fuzzes the targets affected by the change, so a broken or
# crashing harness is caught before it merges.
#
# This is what actually gates changes today.  The CIFuzz workflow does the
# equivalent job via Google's infrastructure, but only once the `r` project
# has been merged into google/oss-fuzz.

on:
  pull_request:
    paths:
      - 'harnesses/**'
      - 'dictionaries/**'
      - 'options/**'
      - 'seeds/**'
      - 'ossfuzz.sh'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite-pr.yml'

permissions: read-all

jobs:
  PR:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      # The base image is private to this repository by default, so the Docker
      # daemon needs credentials before the build can pull it.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        # Several targets time out or exhaust memory by design rather than by
        # regression: TRE backtracks catastrophically on some patterns (the
        # agrep corpus ships one deliberately), and both the decompress and
        # unserialize targets will happily be asked for gigabytes by a crafted
        # input.  Reporting those would fail nearly every run and train
        # reviewers to ignore this check.  Memory-safety bugs, which are the
        # point, are still reported.
        #
        # These are set as environment variables rather than action inputs on
        # purpose: the action pinned at v1 does not declare `report-timeouts`
        # or `report-ooms`, so passing them via `with:` is silently ignored
        # (it only emits an "Unexpected input(s)" warning).  The image behind
        # the action does read these variables.
        env:
          REPORT_TIMEOUTS: false
          REPORT_OOMS: false
        with:
          language: c
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: 'code-change'
          output-sarif: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.build.outcome == 'success'
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
